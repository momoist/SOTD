<!DOCTYPE html>
<html lang="en">
    <head>
        <title>SOTD tracker</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <!--viewport-fit = cover ensures page covers all the nooks and crannies of the device-->
        <link href="style.css" rel="stylesheet" type="text/css" media="all">
        <link rel="manifest" href="/manifest.json">
        <!--you need to have a manifest.json file-->
        <script type="module" src="script.js"></script>
        <link rel="apple-touch-icon" href="/icon-192.png">
    </head>
    <body onload="initDate()">
        <script>
        function initDate() {
            var dayName = new Array("Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday");
            var monthName = new Array("Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec");
            var now = new Date();
            var dateString = monthName[now.getMonth()] + " " + now.getDate();
            document.getElementById("date").innerHTML = dateString;
            document.getElementById("weekday").innerHTML = dayName[now.getDay()];
        };
    </script>
        <div id="sidebar">
            <!--for the icons on the left-->
            <div class="nav-item">
                <a href="/calendar">
                    <!--calendar view-->
                </a>
            </div>
            <div class="nav-item">
                <a href="/log">
                    <!--log history-->
                </a>
            </div>
            <div class="nav-item">
                <a href="/statistics">
                    <!--statistics-->
                </a>
            </div>
            <div class="nav-item">
                <a href="/account">
                    <!--account page-->
                </a>
            </div>
        </div>
        <div id="main-page-content">
            <!--RHS, the actual content of the page-->
            <div id="header">
                <div id="weather-symbol">
                    <!--replace with weather-->
                </div>
                <div id="date">
                    <!--month then number-->
                </div>
                <div id="weekday">Hello</div>
            </div>
            <div id="content-container">
                <!--keeps the blocks inside-->
                <div id="SOTD-block">
                    <!--SOTD-->
                    <p>Enter Song of the Day here:</p>
                    <a href="/SOTD.html" class="plus-button">+</a>
                </div>
                <div id="albums-block">
                    <!--albums record-->
                    <p>Enter album records here:</p>
                    <a href="/albumform.html" class="plus-button">+</a>
                </div>
                <div id="filler">
                    <!--the quote / image to fill the space-->
                </div>
            </div>
            </div>
        </div>
    </body>
</html>
