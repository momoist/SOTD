<!DOCTYPE html>
<html lang="en">
    <head>
        <title>SOTD tracker</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <link href="style.css" rel="stylesheet" type="text/css" media="all">
        <!-- <link rel="manifest" href="/manifest.json"> -->
        <link rel="apple-touch-icon" href="/icon-192.png">
    </head>
    <body>
        <div id="sotd-page-content">
            <div class="title">
                <h1>Album Record</h1>
            </div>
            <div id="form">
                <label for="albumname">Album Name:</label><br>
                <input type="text" id="albumname" name="albumname"><br>
                <label for="artistname">Artist Name:</label><br>
                <input type="text" id="artistname" name="artistname"><br>
                <label for="datereleased">Date Released:</label><br>
                <input type="date" id="datereleased" name="datereleased"><br>
                <label for="dateListened">Date Listened To:</label><br>
                <input type="date" id="dateListened" name="dateListened"><br>
                <label for="albumrating">Rating:</label><br>
                <input type="text" id="albumrating" name="albumrating"><br>
                <div id="genrechips">
                </div>
                <div id="addGenreButton">
                    <input id="newGenre" placeholder="Add a genre…">
                    <button id="addGenre">Add</button>
                </div>
                <label for="nosongs">Number of Songs:</label><br>
                <input type="text" id="nosongs" name="nosongs"><br>
                <label for="noskips">Number of Skips:</label><br>
                <input type="text" id="noskips" name="noskips"><br>
                <!--top 3 songs?-->
                <label for="albumcomments">Comments:</label><br>
                <input type="text" id="albumcomments" name="albumcomments"><br>
                <input type="submit">
                <br>
            </div>
            <a href="/index.html">Back</a>
        </div>
    </body>
    <script type="module" src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</html>
