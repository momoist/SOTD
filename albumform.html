<!DOCTYPE html>
<html lang="en">
    <head>
        <title>SOTD tracker</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <link href="style.css" rel="stylesheet" type="text/css" media="all">
        <!-- <link rel="manifest" href="/manifest.json"> -->
        <link rel="apple-touch-icon" href="/icon-192.png">
    </head>
    <body>
        <div id="sotd-page-content">
            <div class="title">
                <h1>Album Record</h1>
            </div>
            <div id="form">
                <label for="albumname">Album Name:</label><br>
                <input type="text" id="albumname" name="albumname"><br>
                <label for="artistname">Artist Name:</label><br>
                <input type="text" id="artistname" name="artistname"><br>
                <label for="datereleased">Date Released:</label><br>
                <input type="date" id="datereleased" name="datereleased"><br>
                <label for="dateListened">Date Listened To:</label><br>
                <input type="date" id="datelistened" name="datelistened"><br>
                <label for="albumrating">Rating:</label><br>
                <input type="text" id="albumrating" name="albumrating"><br>
                <div id="genrechips">
                </div>
                <div id="addGenreButton">
                    <input id="newGenre" placeholder="Add a genre…">
                    <button id="addGenre">Add</button>
                </div>
                <label for="nosongs">Number of Songs:</label><br>
                <input type="text" id="nosongs" name="nosongs"><br>
                <label for="noskips">Number of Skips:</label><br>
                <input type="text" id="noskips" name="noskips"><br>
                <!--top 3 songs?-->
                <label for="albumcomments">Comments:</label><br>
                <input type="text" id="albumcomments" name="albumcomments"><br>
                <input type="button" id="savebutton" value="save">
                <br>
            </div>
            <a href="/index.html">Back</a>
        </div>
    </body>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        const db = createClient('https://aqwewhtbclsofnrvvqjf.supabase.co', 'sb_publishable_s-ITAmB0d6szJ7sy1sFCcw_7H1Pge4C', 'auth.persistSession = true');
        const genres = ["Rock", "Pop", "Jazz"];
        const selectedGenres = new Set(); 
        
        // event listeners
        document.getElementById("addGenre").addEventListener("click", addGenre);
        document.getElementById("savebutton").addEventListener("click", saveAlbum)

        function initChips() {
            const genreList = document.getElementById("genrechips");
            genreList.innerHTML = ""
            for (const g of genres) {
                const chip = document.createElement("button");
                chip.type = "button";
                chip.textContent = g;
                chip.className = "chip";
                genreList.appendChild(chip);
            };
        };

        function addGenre() {
            const inputBox = document.getElementById("newGenre");
            var newEntry = inputBox.value;
            var flag = false
            for (const element of genres) {
                if (element == newEntry) {
                    flag = true;
                };
            };
            if (flag == false) {
                genres.push(newEntry);
                const genreList = document.getElementById("genrechips");
                const chip = document.createElement("button");
                chip.type = "button";
                chip.textContent = newEntry;
                if (selectedGenres.has(chip)) {
                    chip.className = "chip on";
                } else {
                    chip.className = "chip";
                };
                chip.onclick = () => {
                    if (selectedGenres.has(chip)) {
                        selectedGenres.delete(chip);
                    } else {
                        selectedGenres.add(chip);
                    }
                    initChips();
                };
                genreList.appendChild(chip);
            };
        };

        function numberOrNull(value) {
            if (value === "") {
                return null;
            } else {
                return Number(value);
            };
        }

        async function saveAlbum() {
            //should be run when the submit button is clicked
            // take in values from entered form
            const today = new Date().toLocaleDateString("en-CA");
            const albumname = document.getElementById("albumname").value.trim();
            const artistname = document.getElementById("artistname").value.trim();
            const datereleased = document.getElementById("datereleased").value;
            const datelistened = document.getElementById("datelistened").value;
            const albumrating = document.getElementById("albumrating").value;
            const nosongs = document.getElementById("nosongs").value;
            const noskips = document.getElementById("noskips").value;
            const albumcomments = document.getElementById("albumcomments").value;

            if (!albumname || !artistname) return; // no nulls

            const { dberror } = await db // keep error from database pushing
            .from("albums")
            .upsert( //add to database
                {
                entry_date: today,
                album_name: albumname,
                artist_name: artistname,
                date_released: datereleased || null,
                date_listened: datelistened || null,
                rating: numberOrNull(albumrating),
                no_songs: numberOrNull(nosongs),
                no_skips: numberOrNull(noskips),
                genres: Array.from(selectedGenres), // changes the set into an array

        }; 
        initChips()
    </script>
</html>
